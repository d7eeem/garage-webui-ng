name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's "packageManager" field
      # pins pnpm, and specifying both makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking: a pre-existing lint backlog (mostly @typescript-eslint/
      # no-explicit-any) is tracked separately. Lint still runs so violations
      # stay visible; remove `continue-on-error` once `pnpm run lint` exits 0.
      - name: Lint (non-blocking — see comment)
        run: pnpm run lint
        continue-on-error: true
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  backend:
    name: Backend (build · vet · fmt · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Exact patch, never a floating minor: setup-go resolves a bare 1.25
          # to whatever 1.25.x it has cached, which is how a vulnerable stdlib
          # patch reached a release build. Keep in lockstep with the security
          # job below, release.yml, and the Dockerfile builder image.
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test (race)
        run: go test -race ./...

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go vulnerability database scan (blocking on known CVEs in reachable code).
      - uses: actions/setup-go@v5
        with:
          # Must match the backend job exactly — govulncheck reports stdlib
          # advisories against the toolchain it runs under, so a different
          # (or floating) version here scans something we do not ship.
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && "$(go env GOPATH)/bin/govulncheck" ./...
      # Frontend dependency audit (advisory).
      # No `version:` here on purpose — package.json's "packageManager" field
      # pins pnpm, and specifying both makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (advisory)
        run: pnpm audit --prod
        continue-on-error: true
