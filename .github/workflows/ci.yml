name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking: a pre-existing lint backlog (mostly @typescript-eslint/
      # no-explicit-any) is tracked separately. Lint still runs so violations
      # stay visible; remove `continue-on-error` once `pnpm run lint` exits 0.
      - name: Lint (non-blocking — see comment)
        run: pnpm run lint
        continue-on-error: true
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  backend:
    name: Backend (build · vet · fmt · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test (race)
        run: go test -race ./...

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go vulnerability database scan (blocking on known CVEs in reachable code).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && "$(go env GOPATH)/bin/govulncheck" ./...
      # Frontend dependency audit (advisory).
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (advisory)
        run: pnpm audit --prod
        continue-on-error: true
      # Filesystem scan for dependency CVEs and Dockerfile misconfigurations.
      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
