name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # Build the frontend so it can be embedded into the Go binary.
      # No `version:` here on purpose — package.json's "packageManager" field
      # pins pnpm, and specifying both makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Build binary (linux/${{ matrix.goarch }})
        working-directory: backend
        run: |
          rm -rf ui/dist && cp -r ../dist ui/dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -tags=prod -trimpath -ldflags="-s -w" \
            -o "garage-webui-ng-linux-${{ matrix.goarch }}" main.go

      - name: Attach binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/garage-webui-ng-linux-${{ matrix.goarch }}
          generate_release_notes: true
