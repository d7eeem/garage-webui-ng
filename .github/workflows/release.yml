name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # Build the frontend so it can be embedded into the Go binary.
      # No `version:` here on purpose — package.json's "packageManager" field
      # pins pnpm, and specifying both makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Catches what motivated this check: v3.2.0 was tagged on a tree whose
      # package.json still read 3.1.0. The tag is the source of truth (see
      # backend/version.go); package.json must follow it.
      - name: Verify package.json matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG but package.json says $PKG"
            exit 1
          fi

      - run: pnpm run build

      - uses: actions/setup-go@v5
        with:
          # Exact patch, in lockstep with both ci.yml jobs and the Dockerfile.
          # (This was "1.24" — below the `go 1.25.0` directive in backend/go.mod,
          # which forced an implicit toolchain download on every release build.)
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum

      - name: Build binary (linux/${{ matrix.goarch }})
        working-directory: backend
        run: |
          rm -rf ui/dist && cp -r ../dist ui/dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -tags=prod -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "garage-webui-ng-linux-${{ matrix.goarch }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goarch }}
          path: backend/garage-webui-ng-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Checksum, sign and publish
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Exact patch, in lockstep with both ci.yml jobs, the binaries job
          # above, and the Dockerfile.
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist-artifacts
          sha256sum garage-webui-ng-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set — releases must be signed"
            exit 1
          fi
          cd backend
          go run ./cmd/relsign sign \
            -key-env RELEASE_SIGNING_KEY \
            -in ../dist-artifacts/SHA256SUMS \
            -out ../dist-artifacts/SHA256SUMS.sig
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/garage-webui-ng-linux-*
            dist-artifacts/SHA256SUMS
            dist-artifacts/SHA256SUMS.sig
          generate_release_notes: true
